[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oellm-quickdash"
version = "0.1.0"
description = "Configurable model evaluation analysis for Python and the Quickdash dashboard"
requires-python = ">=3.8"
dependencies = ["PyYAML>=6,<7"]
license = {text = "Apache-2.0"}

[project.scripts]
quickdash = "quickdash.cli:main"

[tool.setuptools]
packages = ["quickdash"]
