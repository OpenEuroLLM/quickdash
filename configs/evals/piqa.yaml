name: PIQA
category: Commonsense
match:
  regex: (?:piqa|global_piqa_completions_.+)
metric: acc_norm
filter: none
score:
  scale: 1
normalize:
  min: 0.5
  max: 1
  clip: true
  basis: uniform_choice
  note: The completion tasks compare two solutions. Uniform guessing gives 1/2. Prompted Global PIQA is configured
    separately and excluded from the supplied comparison sets.
  sources:
    - https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/piqa/piqa.yaml
    - https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/global_piqa/completions/_template
languages:
  - language: eng_Latn
    scope: single
    tasks: [piqa]
    evidence: https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/task-groups.yaml
    note: Original English benchmark variant; language is the prompt/question language.
  - language: sqi_Latn
    scope: single
    tasks: [global_piqa_completions_als_latn]
    evidence: https://huggingface.co/datasets/mrlbenchmarks/global-piqa-nonparallel
