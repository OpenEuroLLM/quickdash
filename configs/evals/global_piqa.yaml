name: global_piqa
category: Commonsense
match:
  regex: global_piqa_completions_.+
metric: acc_norm
metric_filter: none
shots: 10
score:
  scale: 1
normalize:
  min: 0.5
  max: 1
  basis: uniform_choice
  note: The completion tasks compare two solutions. Uniform guessing gives 1/2
  sources:
    - https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/global_piqa/completions/_template
