name: IFEval
category: Instruction following
match:
  name: ifeval
metric: prompt_level_strict_acc
filter: none
score:
  scale: 1
normalize:
  min: 0
  max: 1
  clip: true
  basis: not_applicable
  note: Strict prompt-level instruction success is not a finite-choice task; no defined uniform random baseline.
  sources:
    - https://github.com/google-research/google-research/tree/master/instruction_following_eval
languages:
  - language: eng_Latn
    scope: single
    tasks: [ifeval]
    evidence: https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/task-groups.yaml
    note: Original English benchmark variant; language is the prompt/question language.
