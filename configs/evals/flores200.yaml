name: FLORES200
category: Translation
match:
  regex: flores200:.+
metric: chrf++
filter: rescored
score:
  scale: 100
normalize:
  min: 0
  max: 1
  clip: true
  basis: not_applicable
  note: Select the explicit chrf++ field from the rescored export (preferred over chrf, then bleu). Retain
    native 0–100 points with no chance correction. The CSV does not record the rescoring implementation signature;
    the separate chrf++ label identifies the intended metric.
