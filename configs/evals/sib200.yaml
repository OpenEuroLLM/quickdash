name: sib200
category: Reading
match:
  regex: sib200_.+
# Use acc: acc_norm is not a reliable/useful metric for this eval in our export
# (exactly 0.25 for 34 of 36 languages).
metric: acc
metric_filter: none
shots: 0
score:
  scale: 1
normalize:
  min: 0.14285714285714285
  max: 1
  basis: uniform_choice
  note: The OELLM template lists seven topic choices; uniform guessing gives 1/7. The selected field is raw
    acc, not acc_norm.
  sources:
    - https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/sib200/_default_template_yaml
language_defaults:
  evidence: https://huggingface.co/datasets/Davlan/sib200
  note: Dataset language resolved from the OELLM task registry and benchmark configuration.
