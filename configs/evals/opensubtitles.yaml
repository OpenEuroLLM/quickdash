name: OpenSubtitles
category: Translation
match:
  regex: opensubtitles_.+
metric: chrf
filter: none
score:
  scale: 100
normalize:
  min: 0
  max: 1
  clip: true
  basis: not_applicable
  note: 'Select chrf: the referenced harness uses SacreBLEU defaults (char_order=6, word_order=0, beta=2),
    so this is plain chrF, not chrF++. Prefer an explicitly identified chrF++ result when available, then chrF,
    then BLEU. Retain native 0–100 points with no chance correction.'
  sources:
    - https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/opensubtitles_multi40/utils.py
    - https://github.com/mjpost/sacrebleu/blob/master/sacrebleu/metrics/chrf.py
    - https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/api/metrics.py
languages:
  - source_language: bul_Cyrl
    target_language: eng_Latn
    scope: translation
    tasks: [opensubtitles_multi40_bg_to_en]
    evidence: https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/task-groups.yaml
    note: Source and target from the OpenSubtitles task metadata; bare sr uses the catalogue default script,
      not a sample-level script audit. Source and target are explicit for separate translation-into and translation-from
      views.
