name: XCOPA
category: Commonsense
match:
  regex: xcopa:.+
metric: acc
filter: none
score:
  scale: 1
normalize:
  min: 0.5
  max: 1
  clip: true
  basis: uniform_choice
  note: Translated COPA retains choice1 and choice2; uniform guessing gives 1/2.
  sources:
    - https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/xcopa/utils.py
languages:
  - language: est_Latn
    scope: single
    tasks: ['xcopa:et']
    evidence: https://huggingface.co/datasets/cambridgeltl/xcopa
    note: Dataset language resolved from the OELLM task registry and benchmark configuration.
  - language: ita_Latn
    scope: single
    tasks: ['xcopa:it']
    evidence: https://huggingface.co/datasets/cambridgeltl/xcopa
    note: Dataset language resolved from the OELLM task registry and benchmark configuration.
  - language: tur_Latn
    scope: single
    tasks: ['xcopa:tr']
    evidence: https://huggingface.co/datasets/cambridgeltl/xcopa
    note: Dataset language resolved from the OELLM task registry and benchmark configuration.
