version: 1
name: OELLM eval catalogue
evals:
  - category: Code
    name: CS Algorithms
    metric: exact_match
    filter: strict-match
    match:
      name: bigbench_cs_algorithms_generate_until
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Free-response exact match over algorithm outputs; no defined uniform answer space.
      sources:
        - https://github.com/google/BIG-bench/tree/main/bigbench/benchmark_tasks/cs_algorithms
  - category: Code
    name: HumanEval
    metric: python_pass@1
    filter: ''
    match:
      name: HumanEval
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Executable code pass@1 has no benchmark-defined uniform random-program baseline.
      sources:
        - https://github.com/openai/human-eval
  - category: Code
    name: LiveCodeBench
    metric: accuracy_avg
    filter: ''
    match:
      name: LiveCodeBench
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Generated code is graded by tests; there is no finite choice set to support a 1/K correction.
      sources:
        - https://github.com/LiveCodeBench/LiveCodeBench
  - category: Code
    name: MBPP
    metric: pass_at_1
    filter: none
    match:
      name: mbpp
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Generated code is graded by tests; there is no benchmark-defined random-program baseline.
      sources:
        - https://github.com/google-research/google-research/tree/master/mbpp
  - category: Math
    name: Dyck languages
    metric: exact_match
    filter: strict-match
    match:
      name: bigbench_dyck_languages_generate_until
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Exact-match generated bracket completions have length-dependent spaces; no single fixed baseline is
        assigned.
      sources:
        - https://github.com/google/BIG-bench/tree/main/bigbench/benchmark_tasks/dyck_languages
  - category: Math
    name: Operators
    metric: exact_match
    filter: strict-match
    match:
      name: bigbench_operators_generate_until
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: The selected task uses generated exact-match answers, with no specified random-answer distribution.
      sources:
        - https://github.com/google/BIG-bench/tree/main/bigbench/benchmark_tasks/operators
  - category: Math
    name: Repeat Copy Logic
    metric: exact_match
    filter: strict-match
    match:
      name: bigbench_repeat_copy_logic_generate_until
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: The selected task generates output strings; no defined uniform answer space.
      sources:
        - https://github.com/google/BIG-bench/tree/main/bigbench/benchmark_tasks/repeat_copy_logic
  - category: Math
    name: GSM8K
    metric: exact_match
    filter: flexible-extract
    match:
      name: gsm8k
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Generated numerical answers are not a fixed multiple-choice task; no uniform finite answer space is
        specified.
      sources:
        - https://github.com/openai/grade-school-math
  - category: Math
    name: MGSM
    metric: exact_match
    filter: flexible-extract
    match:
      regex: (?:mgsm_native_cot_.+|global_mgsm_.+)
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Generated numerical answers follow GSM-style scoring; no fixed uniform answer space is specified.
      sources:
        - https://github.com/google-research/url-nlp/tree/main/mgsm
  - category: Math
    name: MATH-500
    metric: accuracy
    filter: ''
    match:
      name: MATH500
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Generated mathematical answers have varying domains; no single uniform guess distribution is defined.
      sources:
        - https://huggingface.co/datasets/HuggingFaceH4/MATH-500
  - category: Reasoning
    name: AIME24
    metric: accuracy_avg
    filter: ''
    match:
      name: AIME24
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Open-ended integer-answer accuracy. Use a zero minimum with no chance correction;
        a uniform random-integer guessing model is not used for this dashboard.
      sources:
        - https://maa.org/maa-invitational-competitions/
        - >-
          https://github.com/mlfoundations/evalchemy/blob/6ed674159b37f740f2353a86f596f49f6ac13c19/eval/chat_benchmarks/AIME24/eval_instruct.py
  - category: Reasoning
    name: AIME25
    metric: accuracy_avg
    filter: ''
    match:
      name: AIME25
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Open-ended integer-answer accuracy. Use a zero minimum with no chance correction;
        a uniform random-integer guessing model is not used for this dashboard.
      sources:
        - https://maa.org/maa-invitational-competitions/
        - >-
          https://github.com/mlfoundations/evalchemy/blob/6ed674159b37f740f2353a86f596f49f6ac13c19/eval/chat_benchmarks/AIME25/eval_instruct.py
  - category: Reasoning
    name: AMC23
    metric: accuracy_avg
    filter: ''
    match:
      name: AMC23
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        This evaluator supplies open-ended questions with answer options removed. The original contest
        five-choice baseline does not apply to this prompt.
      sources:
        - >-
          https://github.com/mlfoundations/evalchemy/blob/6ed674159b37f740f2353a86f596f49f6ac13c19/eval/chat_benchmarks/AMC23/data/amc23.json
  - category: Reasoning
    name: JEEBench
    metric: accuracy_avg
    filter: ''
    match:
      name: JEEBench
    score:
      scale: 1
    normalize:
      # Shared 10.55% baseline; Table 2 reports approximately 10.5%.
      min: 0.1055
      max: 1
      clip: true
      note: >-
        Configured 10.55% overall random baseline, aligned with the shared scoring policy. Table 2 of the
        JEEBench paper reports an approximate 10.5% baseline. It combines
        uniform single-choice guessing and random option subsets with partial credit for multi-answer
        questions, assigning zero expected score to integer and numeric answers. This assumes the full
        515-question benchmark and the paper's scoring rules.
      sources:
        - https://aclanthology.org/2023.emnlp-main.468.pdf#page=5
        - >-
          https://github.com/mlfoundations/evalchemy/blob/6ed674159b37f740f2353a86f596f49f6ac13c19/eval/chat_benchmarks/JEEBench/eval_instruct.py
  - category: Reasoning
    name: LSAT AR
    metric: acc_norm
    filter: none
    match:
      name: agieval_lsat_ar
    score:
      scale: 1
    normalize:
      min: 0.2
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        One correct choice among five LSAT analytical reasoning options; uniform valid-choice guessing gives
        1/5.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/agieval/lsat-ar.yaml
        - https://huggingface.co/datasets/hails/agieval-lsat-ar
  - category: Reasoning
    name: PolyMath
    metric: exact_match
    filter: none
    match:
      regex: polymath_.+
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Generated mathematical answers are scored by exact match; no common finite answer space is defined.
      sources:
        - https://github.com/QwenLM/PolyMath
  - category: Knowledge
    name: ARC Challenge
    metric: acc_norm
    filter: none
    match:
      regex: arc_challenge(?:_mt_.+)?
    score:
      scale: 1
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        Initial approximation: 25% chance. In the published 1,172-question Challenge test split, 1,165
        questions have four choices, four have three and three have five. Mean uniform-guess accuracy is
        25.0156428%, so 25% is a close approximation. The same initial floor is applied to translated
        variants; preservation of every choice count has not been audited. This is an approximate baseline,
        not a claim that every item has exactly four options.
      sources:
        - https://ai2-public-datasets.s3.amazonaws.com/arc/ARC-V1-Feb2018.zip
        - https://huggingface.co/datasets/allenai/ai2_arc
        - https://huggingface.co/datasets/LumiOpen/arc_challenge_mt
  - category: Knowledge
    name: ARC Easy
    metric: acc_norm
    filter: none
    match:
      name: arc_easy
    score:
      scale: 1
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        Use the conventional four-choice approximation of 0.25. The published test split includes a few
        three- and five-choice questions (mean guessing accuracy approximately 0.2501613); this small
        difference is intentionally ignored for consistency.
      sources:
        - https://ai2-public-datasets.s3.amazonaws.com/arc/ARC-V1-Feb2018.zip
        - https://huggingface.co/datasets/allenai/ai2_arc
  - category: Knowledge
    name: GPQA Diamond
    metric: accuracy_avg
    filter: ''
    match:
      name: GPQADiamond
    score:
      scale: 1
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: The evaluator constructs four options and extracts A/B/C/D; uniform valid-letter guessing gives 1/4.
      sources:
        - >-
          https://github.com/mlfoundations/evalchemy/blob/6ed674159b37f740f2353a86f596f49f6ac13c19/eval/chat_benchmarks/GPQADiamond/eval_instruct.py
  - category: Knowledge
    name: INCLUDE
    metric: acc
    filter: none
    match:
      regex: include_base_44_.+
    score:
      scale: 1
    select:
      regex: include_base_44_[^_]+
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        The INCLUDE task templates score A/B/C/D against one answer; 1/4 also holds for weighted aggregates of
        four-choice subjects.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/include/default/Albanian/_albanian_template_yaml
        - https://huggingface.co/datasets/CohereLabs/include-base-44
  - category: Knowledge
    name: Jeopardy
    metric: exact_match
    filter: strict-match
    match:
      name: jeopardy
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Generated exact-match answers have no defined uniform choice set.
      sources:
        - >-
          https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/jeopardy.yaml
  - category: Knowledge
    name: MMLU
    metric: acc
    filter: none
    match:
      regex: mmlu(?:_.+)?
    score:
      scale: 1
    select:
      name: mmlu
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        Original MMLU uses four choices and one correct label. Uniform guessing gives 1/4, including
        subject summaries.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/mmlu/default/_default_template_yaml
  - category: Knowledge
    name: Global MMLU
    metric: acc
    filter: none
    match:
      regex: global_mmlu_.+
    score:
      scale: 1
    select:
      regex: global_mmlu_full_[a-z]+
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        Global MMLU uses four choices and one correct label. Uniform guessing gives 1/4, including
        subject summaries.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/global_mmlu/default/en/_en_template_yaml
  - category: Knowledge
    name: OpenBookQA
    metric: acc_norm
    filter: none
    match:
      name: openbookqa
    score:
      scale: 1
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: The benchmark has exactly four choices per question. The paper reports a 25% uniform-guess baseline.
      sources:
        - https://arxiv.org/html/1809.02789v1#S3.SS3
  - category: Knowledge
    name: QA Wikidata
    metric: exact_match
    filter: strict-match
    match:
      name: bigbench_qa_wikidata_generate_until
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: The selected generate-until task uses open-ended exact match; no fixed choice count.
      sources:
        - https://github.com/google/BIG-bench/tree/main/bigbench/benchmark_tasks/qa_wikidata
  - category: Commonsense
    name: CommonsenseQA
    metric: acc
    filter: none
    match:
      name: commonsense_qa
    score:
      scale: 1
    normalize:
      min: 0.2
      max: 1
      clip: true
      basis: uniform_choice
      note: The task scores five labels A through E; uniform guessing gives 1/5.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/commonsense_qa/default.yaml
  - category: Commonsense
    name: COPA
    metric: acc
    filter: none
    match:
      name: copa
    score:
      scale: 1
    normalize:
      min: 0.5
      max: 1
      clip: true
      basis: uniform_choice
      note: Two possible causes or effects are scored; uniform guessing gives 1/2.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/super_glue/copa/utils.py
  - category: Commonsense
    name: HellaSwag
    metric: acc_norm
    filter: none
    shots: 0
    match:
      regex: hellaswag(?:_.+)?
    score:
      scale: 1
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        Four candidate endings; the benchmark reports random performance of 25%. Applied to the translated
        variants of the same task.
      sources:
        - https://rowanzellers.com/hellaswag/
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/hellaswag/hellaswag.yaml
  - category: Commonsense
    name: PIQA
    metric: acc_norm
    filter: none
    match:
      regex: (?:piqa|global_piqa_completions_.+)
    score:
      scale: 1
    normalize:
      min: 0.5
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        The completion tasks compare two solutions. Uniform guessing gives 1/2. Prompted Global PIQA is
        configured separately and excluded from the supplied comparison sets.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/piqa/piqa.yaml
        - >-
          https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/global_piqa/completions/_template
  - category: Commonsense
    name: Global PIQA (prompted)
    match:
      regex: global_piqa_prompted_.+
    metric: exact_match
    filter: strict_match
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: unresolved
      note: Provisional scale conversion only; no validated chance correction for the prompted protocol.
    warning: >-
      Normalization and metric selection have not been validated for prompted Global PIQA.
      The supplied comparison sets exclude this eval. Review the protocol before including its scores.
  - category: Commonsense
    name: Social IQa
    metric: acc
    filter: none
    match:
      name: social_iqa
    score:
      scale: 1
    normalize:
      min: 0.3333333333333333
      max: 1
      clip: true
      basis: uniform_choice
      note: The task scores answerA, answerB and answerC; uniform guessing gives 1/3.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/siqa/siqa.yaml
  - category: Commonsense
    name: WSC273
    metric: acc
    filter: none
    match:
      name: wsc273
    score:
      scale: 1
    normalize:
      min: 0.5
      max: 1
      clip: true
      basis: uniform_choice
      note: The evaluator compares two candidate antecedents; uniform guessing gives 1/2.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/wsc273/default.yaml
  - category: Commonsense
    name: WinoGrande
    metric: acc
    filter: none
    match:
      name: winogrande
    score:
      scale: 1
    normalize:
      min: 0.5
      max: 1
      clip: true
      basis: uniform_choice
      note: The evaluator compares option1 and option2; uniform guessing gives 1/2.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/winogrande/preprocess_winogrande.py
  - category: Commonsense
    name: X-CSQA
    metric: acc_norm
    filter: none
    match:
      regex: xcsqa_.+
    score:
      scale: 1
    normalize:
      min: 0.2
      max: 1
      clip: true
      basis: uniform_choice
      note: Translated CommonsenseQA retains five answer options; uniform guessing gives 1/5.
      sources:
        - https://inklab.usc.edu/XCSR/xcsr_datasets#x-csqa
        - >-
          https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/xcsqa/_default_template_yaml
  - category: Commonsense
    name: XCOPA
    metric: acc
    filter: none
    match:
      regex: xcopa:.+
    score:
      scale: 1
    normalize:
      min: 0.5
      max: 1
      clip: true
      basis: uniform_choice
      note: Translated COPA retains choice1 and choice2; uniform guessing gives 1/2.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/xcopa/utils.py
  - category: Reading
    name: Belebele
    metric: acc_norm
    filter: none
    match:
      regex: belebele_.+
    score:
      scale: 1
    normalize:
      min: 0.25
      max: 1
      clip: true
      basis: uniform_choice
      note: All language variants score four labels A/B/C/D; uniform guessing gives 1/4.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/belebele/_default_template_yaml
  - category: Reading
    name: BoolQ
    metric: acc
    filter: none
    match:
      name: boolq
    score:
      scale: 1
    normalize:
      min: 0.5
      max: 1
      clip: true
      basis: uniform_choice
      note: The task scores no/yes. This is a uniform-guess baseline of 1/2, not a majority-class baseline.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/super_glue/boolq/default.yaml
  - category: Reading
    name: CoQA
    metric: f1
    filter: none
    match:
      name: coqa
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: Token-overlap F1 for generated conversational answers has no universal chance floor.
      sources:
        - https://stanfordnlp.github.io/coqa/
  - category: Reading
    name: LAMBADA
    metric: acc
    filter: none
    match:
      name: lambada_openai
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Next-word prediction accuracy is not fixed-choice accuracy. Vocabulary and a guessing distribution
        would be needed.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/lambada/lambada_openai.yaml
  - category: Reading
    name: SIB-200
    # Use acc: acc_norm is not a reliable/useful metric for this eval in our export
    # (exactly 0.25 for 34 of 36 languages).
    metric: acc
    filter: none
    match:
      regex: sib200_.+
    score:
      scale: 1
    normalize:
      min: 0.14285714285714285
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        The OELLM template lists seven topic choices; uniform guessing gives 1/7. The selected field is raw
        acc, not acc_norm.
      sources:
        - >-
          https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/sib200/_default_template_yaml
  - category: Reading
    name: SQuAD v2
    metric: f1
    filter: none
    match:
      name: squadv2
    score:
      scale: 100
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        F1 mixes span overlap and unanswerable questions; neither 0 nor 50% is an established random baseline.
        Keep only scale conversion.
      sources:
        - https://rajpurkar.github.io/SQuAD-explorer/
  - category: Translation
    name: FLORES200
    metric: chrf++
    filter: rescored
    match:
      regex: flores200:.+
    score:
      scale: 100
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Select the explicit chrf++ field from the rescored export (preferred over chrf, then bleu).
        Retain native 0–100 points with no chance correction. The CSV does not record the rescoring
        implementation signature; the separate chrf++ label identifies the intended metric.
      sources:
        - https://github.com/mjpost/sacrebleu/blob/master/sacrebleu/metrics/chrf.py
        - https://github.com/facebookresearch/flores
  - category: Translation
    name: OpenSubtitles
    metric: chrf
    filter: none
    match:
      regex: opensubtitles_.+
    score:
      scale: 100
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Select chrf: the referenced harness uses SacreBLEU defaults (char_order=6, word_order=0, beta=2),
        so this is plain chrF, not chrF++. Prefer an explicitly identified chrF++ result when available,
        then chrF, then BLEU. Retain native 0–100 points with no chance correction.
      sources:
        - >-
          https://github.com/OpenEuroLLM/oellm-eval/blob/8a4b2412a8e8f7f0d95e3845e2164c792add6a79/oellm/resources/custom_lm_eval_tasks/opensubtitles_multi40/utils.py
        - https://github.com/mjpost/sacrebleu/blob/master/sacrebleu/metrics/chrf.py
        - https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/api/metrics.py
  - category: Language
    name: Language ID
    metric: acc
    filter: none
    match:
      name: bigbench_language_identification_multiple_choice
    score:
      scale: 1
    normalize:
      min: 0.09090909090909091
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        Each question offers 11 language names with one correct answer. The corpus covers 1,000 languages, but
        the per-question guess baseline is 1/11.
      sources:
        - >-
          https://github.com/google/BIG-bench/blob/main/bigbench/benchmark_tasks/language_identification/README.md
  - category: Language
    name: MultiBlimp
    warning: >-
      Language-grouping approximation: multiblimp_hbs pools Croatian and Serbian. Assign its combined
      score to Serbian (srp_Latn) because Serbian has more speakers, not because of the dataset's
      language proportions. The score still includes both languages and is not a Serbian-only result.
    metric: acc_norm
    filter: none
    match:
      regex: multiblimp_.+
    score:
      scale: 1
    normalize:
      min: 0.5
      max: 1
      clip: true
      basis: uniform_choice
      note: >-
        A minimal pair compares a grammatical sentence with an ungrammatical one; chance under random
        preference is 1/2.
      sources:
        - >-
          https://github.com/EleutherAI/lm-evaluation-harness/blob/d6de81643928d653435c431bae19945d41d32520/lm_eval/tasks/multiblimp/_template_yaml
  - category: Instruction following
    name: IFEval
    metric: prompt_level_strict_acc
    filter: none
    match:
      name: ifeval
    score:
      scale: 1
    normalize:
      min: 0
      max: 1
      clip: true
      basis: not_applicable
      note: >-
        Strict prompt-level instruction success is not a finite-choice task; no defined uniform random
        baseline.
      sources:
        - https://github.com/google-research/google-research/tree/master/instruction_following_eval
