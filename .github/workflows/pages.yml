name: Check and publish Quickdash

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickdash-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check scoring, imports, and configuration
        run: |
          python3 -m unittest tests.test_data
          node --test tests/test_data.cjs tests/test_yaml.cjs tests/test_suites.cjs
      - name: Check the browser with public fixtures
        run: |
          google-chrome --headless --no-sandbox --disable-gpu \
            --no-first-run --no-default-browser-check \
            --remote-debugging-port=9227 \
            --user-data-dir="$RUNNER_TEMP/quickdash-chrome" about:blank \
            > "$RUNNER_TEMP/quickdash-chrome.log" 2>&1 &
          quickdash_chrome_pid=$!
          trap 'kill "$quickdash_chrome_pid" 2>/dev/null || true' EXIT
          node tests/test_public_browser.mjs || { cat "$RUNNER_TEMP/quickdash-chrome.log"; exit 1; }
      - name: Build shared results and the fictional demo
        run: |
          python3 -m app.build --results-dir results \
            --output output/shared > "$RUNNER_TEMP/quickdash-shared.json"
          python3 -m app.build examples/scores.csv --catalogue configs/examples/catalogue.yaml \
            --weights configs/examples/weights.yaml --eval-set configs/sets/any-available.yaml \
            --output output/demo > "$RUNNER_TEMP/quickdash-demo.json"
          mkdir -p output/site
          cp output/shared/index.html output/site/index.html
          cp output/demo/index.html output/site/demo.html
          cp LICENSE app/vendor/js-yaml.LICENSE output/site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish the checked dashboard
        id: deployment
        uses: actions/deploy-pages@v5
