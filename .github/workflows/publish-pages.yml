name: Publish dashboard and PR previews

on:
  workflow_run:
    workflows: [Check and publish Quickdash]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

# Reconcile all open PRs on every run: Actions may coalesce pending runs.
concurrency:
  group: quickdash-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      checks: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This privileged workflow only executes default-branch code. PR artifacts
      # are read as data, including when the completed build came from a fork.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v6
        id: pages
      - name: Assemble production and open PR previews
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/pages_preview.py assemble --site "$RUNNER_TEMP/quickdash-pages" \
            --default-branch "$DEFAULT_BRANCH" --base-url "$PAGES_BASE_URL"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/quickdash-pages
      - name: Publish dashboard and previews
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Link deployed previews from PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/pages_preview.py report --site "$RUNNER_TEMP/quickdash-pages" \
            --default-branch "$DEFAULT_BRANCH" --base-url "$PAGES_BASE_URL"
