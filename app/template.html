<header><h1>Quickdash · OELLM evals</h1><span>DRAFT SCORING SCHEME</span></header>
<main><p id="demo" class="notice"></p><div id="error" role="alert"></div>
<div class="model-controls"><label>Weighting profile<select id="weightPreset"></select></label><label>Eval set<select id="suitePreset"></select></label><label>Eval settings<select id="matching"><option value="strict">Strict matching</option><option value="relaxed">Relaxed — allow few-shot differences</option></select></label><span class="caption">Weights and eval sets are independent. “Any available” needs no list of evals.</span></div>
<div class="model-controls"><label>Model A<select id="modelA"></select></label><label>Model B<select id="modelB"></select></label><button id="swap">Swap A ↔ B</button><label class="import-label">Add model CSV<input type="file" id="modelFile" accept=".csv"></label><button id="clearModels" title="Remove loaded models from this browser session; reload to restore published models">Clear models</button></div>
<section class="aggregate-controls" aria-labelledby="aggregateHeading"><h2 id="aggregateHeading">Score calculation</h2><div class="aggregate-options" role="group" aria-label="Choose score calculation"><button data-aggregate="standard" aria-pressed="true">Original weighted score<small>Average evals equally within each category</small></button><button data-aggregate="english_eval" aria-pressed="false">English balance per eval<small>Balance within each eval; keep equal eval weights</small></button><button data-aggregate="english_category" aria-pressed="false">English balance per category<small>Enforce the category’s language split; eval weights can differ</small></button></div><p id="aggregateNote" class="caption"></p></section><p id="matchingNotice" class="notice" role="status" hidden></p><div id="cards"></div><p id="coverage" class="caption"></p>

<div id="filters" class="filters" hidden><div class="view-controls"><label>Category<select id="category"></select></label><label>Language<select id="language"></select></label><label>Language role<select id="direction"><option value="">All roles</option><option value="eval">Evals in language</option><option value="to">Translation into</option><option value="from">Translation from</option></select></label><label>Eval<select id="eval"></select></label><label>Search<input id="search" type="search" placeholder="Eval name or metric"></label><button id="clear">Clear filters</button></div><p class="caption" id="filterStatus"></p></div>
